name: Refresh data
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python export_data.py
      - name: Show what was built
        run: python -c "import json; d=json.load(open('data.json')); print('built', d['meta']['asof'], 'stats:', list(d['val']))"
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "data.json unchanged, nothing to commit"; else git commit -m "Refresh data" && git push; fi
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "Pages rebuild request skipped"
